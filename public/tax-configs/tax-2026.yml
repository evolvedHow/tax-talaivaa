meta:
  tax_year: 2026
  label: "2026 Federal + NY/GA/IL/CA/NJ/TX/FL Tax Rules"
  description: "Federal income tax rules for 2026 (IRS Rev. Proc. 2025-32 + OBBBA) plus New York, Georgia, Illinois, California, New Jersey, Texas, and Florida state rules"
  last_updated: "2026-09-08"

federal:
  standard_deduction:
    single: 16100
    married_filing_jointly: 32200
    head_of_household: 24150
    married_filing_separately: 16100

  senior_bonus:
    # OBBBA §70103: $6,000 age-65+ "senior bonus" per qualifying person
    # (2025–2028) STACKS on the permanent age-65/blind add-on. The interpreter
    # models a single bonus, so amounts combine both layers:
    #   single/HoH: 2050 (age add-on) + 6000 (OBBBA) = 8050
    #   MFJ:        1650 (per spouse) + 6000 (OBBBA) = 7650
    # The 6% phase-out is applied to the combined amount; for the combined
    # figure it is exactly equivalent to phasing only the OBBBA portion until
    # the bonus is fully exhausted (MAGI 175K single / 250K MFJ).
    single:
      amount: 8050
      phase_out_threshold: 75000
      phase_out_rate: 0.06
    married_filing_jointly:
      amount: 7650
      phase_out_threshold: 150000
      phase_out_rate: 0.06
    head_of_household:
      amount: 8050
      phase_out_threshold: 75000
      phase_out_rate: 0.06
    married_filing_separately:
      # OBBBA senior bonus requires a joint return (MFS gets $0); the
      # permanent age-65 add-on of $1,650 still applies with no phase-out.
      amount: 1650
      phase_out_threshold: 9999999
      phase_out_rate: 0

  brackets: # IRS Rev. Proc. 2025-32
    single:
      - { floor: 0,       ceiling: 12400,  rate: 0.10 }
      - { floor: 12400,   ceiling: 50400,  rate: 0.12 }
      - { floor: 50400,   ceiling: 105700, rate: 0.22 }
      - { floor: 105700,  ceiling: 201775, rate: 0.24 }
      - { floor: 201775,  ceiling: 256225, rate: 0.32 }
      - { floor: 256225,  ceiling: 640600, rate: 0.35 }
      - { floor: 640600,  ceiling: null,   rate: 0.37 }
    married_filing_jointly:
      - { floor: 0,       ceiling: 24800,  rate: 0.10 }
      - { floor: 24800,   ceiling: 100800, rate: 0.12 }
      - { floor: 100800,  ceiling: 211400, rate: 0.22 }
      - { floor: 211400,  ceiling: 403550, rate: 0.24 }
      - { floor: 403550,  ceiling: 512450, rate: 0.32 }
      - { floor: 512450,  ceiling: 768700, rate: 0.35 }
      - { floor: 768700,  ceiling: null,   rate: 0.37 }
    head_of_household:
      - { floor: 0,       ceiling: 17700,  rate: 0.10 }
      - { floor: 17700,   ceiling: 67450,  rate: 0.12 }
      - { floor: 67450,   ceiling: 105700, rate: 0.22 }
      - { floor: 105700,  ceiling: 201750, rate: 0.24 }
      - { floor: 201750,  ceiling: 256200, rate: 0.32 }
      - { floor: 256200,  ceiling: 640600, rate: 0.35 }
      - { floor: 640600,  ceiling: null,   rate: 0.37 }
    married_filing_separately:
      - { floor: 0,       ceiling: 12400,  rate: 0.10 }
      - { floor: 12400,   ceiling: 50400,  rate: 0.12 }
      - { floor: 50400,   ceiling: 105700, rate: 0.22 }
      - { floor: 105700,  ceiling: 201775, rate: 0.24 }
      - { floor: 201775,  ceiling: 256225, rate: 0.32 }
      - { floor: 256225,  ceiling: 384350, rate: 0.35 }
      - { floor: 384350,  ceiling: null,   rate: 0.37 }

  itemized_deductions:
    salt:
      cap: # OBBBA: $40,400 through 2029 (phases down above ~$500K AGI to $10K floor)
        single: 40400
        married_filing_jointly: 40400
        head_of_household: 40400
        married_filing_separately: 20200
      phase_out:
        # OBBBA phases the CAP itself down above $500K/$505K AGI; the
        # interpreter phases the deduction amount instead, so a flat cap with
        # no phase-out is the faithful modeling choice here.
        single:
          threshold: 9999999
          rate: 0
        married_filing_jointly:
          threshold: 9999999
          rate: 0
        head_of_household:
          threshold: 9999999
          rate: 0
        married_filing_separately:
          threshold: 9999999
          rate: 0
    mortgage_interest:
      cap: 750000 # OBBBA cap extended through 2029
    charity:
      cap_pct_agi: 0.60 # 60% of AGI for cash donations

  ira: # IRS Notice 2025-67 (IR-2025-111)
    limit: 7500
    limit_50_plus: 8600 # $7,500 + $1,100 catch-up
    phase_out:
      single:
        floor: 81000
        ceiling: 91000
      married_filing_jointly:
        floor: 129000
        ceiling: 149000
      head_of_household:
        floor: 81000
        ceiling: 91000
      married_filing_separately:
        floor: 0
        ceiling: 10000

  capital_gains: # IRS Rev. Proc. 2025-32
    single:
      - { floor: 0,      ceiling: 49450,  rate: 0.00 }
      - { floor: 49450,  ceiling: 545500, rate: 0.15 }
      - { floor: 545500, ceiling: null,   rate: 0.20 }
    married_filing_jointly:
      - { floor: 0,      ceiling: 98900,  rate: 0.00 }
      - { floor: 98900,  ceiling: 613700, rate: 0.15 }
      - { floor: 613700, ceiling: null,   rate: 0.20 }
    head_of_household:
      - { floor: 0,      ceiling: 66200,  rate: 0.00 }
      - { floor: 66200,  ceiling: 579600, rate: 0.15 }
      - { floor: 579600, ceiling: null,   rate: 0.20 }
    married_filing_separately:
      - { floor: 0,      ceiling: 49450,  rate: 0.00 }
      - { floor: 49450,  ceiling: 306850, rate: 0.15 }
      - { floor: 306850, ceiling: null,   rate: 0.20 }

  credits:
    child_tax_credit: # OBBBA retains $2,000/child under 17 through 2029
      amount_per_child: 2000
      phase_out:
        single:
          threshold: 200000
          rate_per_1000: 50
        married_filing_jointly:
          threshold: 400000
          rate_per_1000: 50
        head_of_household:
          threshold: 200000
          rate_per_1000: 50
        married_filing_separately:
          threshold: 200000
          rate_per_1000: 50

  surtaxes:
    niit:
      rate: 0.038
      threshold:
        single: 200000
        married_filing_jointly: 250000
        head_of_household: 200000
        married_filing_separately: 125000
      base: lesser_of_net_investment_income_or_magi_excess

  warnings:
    amt:
      trigger_if_any_present:
        - iso_options_exercised
        - has_amt_preference_items

levers:
  - id: filing_status
    label: Filing Status
    type: dropdown
    default: single
    options:
      - single
      - married_filing_jointly
      - head_of_household
      - married_filing_separately
    help: >
      Determines your tax brackets, standard deduction, and credit phase-out
      thresholds. Married Filing Jointly generally yields the most favorable
      rates. Head of Household requires being unmarried with a qualifying
      dependent living with you more than half the year.

  - id: wages_income
    label: W-2 Wages
    type: slider
    min: 0
    max: 1000000
    step: 5000
    default: 150000
    help: >
      W-2 wages from employment. Taxed at graduated federal brackets (10%–37%).
      Starting point for IRA deduction phase-out calculations.

  - id: bonus
    label: Bonus / Other Ordinary Income
    type: slider
    min: 0
    max: 500000
    step: 5000
    default: 0
    help: >
      Cash bonuses, commissions, or other W-2 ordinary income beyond regular
      wages. Taxed at your marginal bracket rate.

  - id: investment_income
    label: Interest / Non-Qualified Dividends
    type: slider
    min: 0
    max: 200000
    step: 1000
    default: 0
    help: >
      Bank interest, bond interest, and non-qualified dividends. Taxed at
      regular income bracket rates — not the preferential 0/15/20% rate.
      Counts toward the NIIT base.

  - id: short_term_capital_gains
    label: Short-Term Capital Gains
    type: slider
    min: 0
    max: 500000
    step: 5000
    default: 0
    help: >
      Gains from assets held 1 year or less. Taxed as ordinary income at your
      marginal bracket rate. Consider holding over 1 year to convert to
      long-term rates.

  - id: business_income
    label: Business / Self-Employment Income
    type: slider
    min: 0
    max: 1000000
    step: 5000
    default: 0
    help: >
      Net Schedule C profit or other self-employment income after business
      expenses. Taxed at regular income brackets. Note: the ~15.3%
      self-employment tax is not separately modeled here.

  - id: capital_gains
    label: Long-Term Capital Gains
    type: slider
    min: 0
    max: 500000
    step: 5000
    default: 0
    help: >
      Gains from assets held more than 1 year. Taxed at preferential federal
      rates: 0%, 15%, or 20% depending on total income.

  - id: qualified_dividends
    label: Qualified Dividends
    type: slider
    min: 0
    max: 500000
    step: 1000
    default: 0
    help: >
      Dividends from domestic and qualifying foreign corporations held for the
      required period. Taxed at the same preferential 0/15/20% rates as
      long-term capital gains. Counts toward the NIIT base.

  - id: rental_income
    label: Rental / Passive Income
    type: slider
    min: 0
    max: 500000
    step: 5000
    default: 0
    help: >
      Net rental income after expenses. Treated as ordinary income here
      (passive activity loss rules are not modeled). Counts toward the NIIT
      base for the 3.8% surtax.

  - id: ira_contribution
    label: IRA Contribution
    type: slider
    min: 0
    max: 8600
    step: 500
    default: 0
    help: >
      Traditional IRA contributions reduce taxable income dollar-for-dollar
      (subject to phase-out if covered by a workplace plan). 2026 limit:
      $7,500 ($8,600 if age 50+).

  - id: has_workplace_plan
    label: Covered by Workplace Retirement Plan
    type: toggle
    default: false
    help: >
      If you (or your spouse for MFJ) participate in a 401(k), 403(b), SEP,
      or SIMPLE plan, your Traditional IRA deduction phases out at lower MAGI
      levels. Without any workplace plan coverage, the full IRA contribution
      is always deductible regardless of income.

  - id: age
    label: Age
    type: integer
    min: 18
    max: 90
    step: 1
    default: 40
    help: >
      Used to calculate IRA catch-up contribution eligibility ($1,100 extra
      allowed at age 50+). If 65 or older, the senior standard deduction bonus
      ($6,000 OBBBA + age add-on, phased out above $75K MAGI single / $150K
      MFJ) is applied automatically.

  - id: num_children
    label: Qualifying Children (Child Tax Credit)
    type: integer
    min: 0
    max: 10
    step: 1
    default: 0
    help: >
      Each qualifying child under age 17 earns a $2,000 Child Tax Credit.
      Phases out by $50 per $1,000 of income above $200K (single) or $400K (MFJ).

  - id: state_local_tax
    label: State & Local Taxes Paid (SALT)
    type: slider
    min: 0
    max: 60000
    step: 500
    default: 8000
    help: >
      State income taxes or property taxes you paid during the year. Deductible
      only when itemizing, and capped at $40,400 ($20,200 if MFS) for 2026
      under the OBBBA SALT extension. High-tax-state residents often hit this
      cap quickly.

  - id: mortgage_interest
    label: Mortgage Interest Paid
    type: slider
    min: 0
    max: 100000
    step: 500
    default: 0
    help: >
      Interest on mortgage acquisition debt up to $750,000 (OBBBA extends the
      cap through 2029). Deductible only when itemizing.

  - id: charitable_contributions
    label: Charitable Contributions
    type: slider
    min: 0
    max: 500000
    step: 1000
    default: 0
    help: >
      Cash donations to qualified 501(c)(3) organizations. Deductible only
      when itemizing, capped at 60% of AGI for cash donations.

  - id: state
    label: State
    type: dropdown
    default: none
    options:
      - none
      - NY
      - GA
      - IL
      - CA
      - NJ
      - TX
      - FL
    help: >
      Adds state income tax to your total liability. New York uses progressive
      brackets (3.9%–10.9% for 2026); California uses progressive brackets
      (1%–13.3%); New Jersey uses progressive brackets (1.4%–10.75%); Georgia
      uses a flat 4.99% rate for 2026; Illinois uses a flat 4.95% rate; Texas
      and Florida have no state income tax. Select "none" for states not modeled.

  - id: iso_options_exercised
    label: Exercised ISO Stock Options (AMT trigger)
    type: toggle
    default: false
    help: >
      Exercising Incentive Stock Options creates an AMT preference item.
      This can trigger significant Alternative Minimum Tax. Consult a tax
      advisor before exercising a large ISO grant.

  - id: has_amt_preference_items
    label: Has AMT Preference Items
    type: toggle
    default: false
    help: >
      Certain deductions and income items are added back under AMT rules.
      The AMT exemption for 2026 is $90,100 (single) / $140,200 (MFJ).

  - id: federal_withheld
    label: Federal Tax Already Withheld (W-2 Box 2)
    type: slider
    min: 0
    max: 200000
    step: 500
    default: 0
    help: >
      Total federal income tax withheld from paychecks plus estimated
      tax payments (Form 1040-ES). The app will show your refund or
      amount owed based on this vs. your computed liability.

  - id: state_withheld
    label: State Tax Already Withheld (W-2 Box 17)
    type: slider
    min: 0
    max: 100000
    step: 250
    default: 0
    help: >
      State income tax withheld from paychecks. Add all W-2s and any
      estimated state tax payments made during the year.

